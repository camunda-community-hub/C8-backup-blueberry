blueberry:
  optimizeActuatorUrl: http://camunda-optimize:9600
  operateActuatorUrl: http://camunda-operate:9600
  tasklistActuatorUrl: http://camunda-tasklist:9600
  zeebeActuatorUrl: http://camunda-zeebe:9600
  elasticsearchurl: http://camunda-elasticsearch:9200

  namespace: camunda
  # Path to kubeconfig when Blueberry runs outside the cluster (for restore and K8s exploration).
  # kubeConfig: /Users/you/.kube/config
  # kubectl context when ~/.kube/config has several clusters (e.g. GKE + kind). Avoids GKE exec auth for local dev.
  # kubeContext: kind-camunda-platform-local

  # PwC Camunda 8.7 restore. execution stays false until you intend to delete indices and Zeebe volumes.
  restore:
    execution: false
    helmRelease: camunda87helm
    podDeleteTimeoutSeconds: 300
    zeebeRestoreTimeoutSeconds: 1800

  # This information is temporary. They must come from the pod itself
  operateRepository: operaterepository
  tasklistRepository: tasklistrepository
  optimizeRepository : optimizerepository
  zeebeRepository: zeeberecordrepository

  kubernetes:
    token: gcloud
    masterUrl: "https"
    certificate-authority-data: ""
    name: ""

  # When repository need to be created, then a base path is used. All based path used
  elasticsearch:
    operateContainerBasePath: /operate
    tasklistContainerBasePath: /tasklist
    optimizeContainerBasePath: /optimize
    zeebeRecordContainerBasePath: /zeeberecord
    # ZeebeRecord need a backup. Here is the name of the backup to be created
    zeebeRecordRepository: camunda_zeebe_records_backup
    zeebeRecordBasePath: zeeberecordbackup

    # Define the container used by Zeebe and by ElasticSearch
  container:
    containerType: gcs
    azure:
      containerName: "YourAzureContainerName"
    s3:
      bucket: "YourS3Bucket"
      region: "us-east-2"
    gcs:
      bucket: "pym-pc8backup-20250411"
      basePath: "zeebecontainer"
      region: "us-east-2"


server:
  port: 9082

# -------------------- Self Manage
camunda:
  client:
    mode: self-managed
    zeebe:
      # The Camunda 8.7.24+ starter creates the client configuration (ZeebeClientConfigurationImpl) only when enabled
      enabled: true
      grpcAddress: http://camunda-zeebe-gateway:26500
      preferRestOverGrpc: false


  operate:
    enabled: false


logging.level.root: INFO


# return message with BAD_REQUEST to the client
server.error.include-message: always

# Spring Boot Configuration
spring.application.name: Blueberry

spring:
  # Default database: H2 file based, in ./data (no external database needed). Override with SPRING_DATASOURCE_URL.
  # (Spring Boot 4 moved DataSourceAutoConfiguration: the old exclude is ignored, JPA needs a database)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/blueberry;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
