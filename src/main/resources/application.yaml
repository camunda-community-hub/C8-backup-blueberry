blueberry:
  optimizeActuatorUrl: http://camunda-optimize:9600
  zeebeActuatorUrl: http://localhost:9600
  elasticsearchurl: http://localhost:9200

  # This information is temporary. They must come from the pod itself
  optimizeRepository : optimizerepository
  zeebeRepository: zeeberecordrepository

  restore:
    execution: false

  optimize:
    enabled: false

  # The backup uses the REST API of the cluster (/v2/exporting, /v2/backups). By default the rest address of the Camunda
  # client (camunda.client.zeebe.rest-address) and its basic authentication (camunda.client.auth) are used.
  # zeebeRestUrl: http://camunda-zeebe-gateway:8080

  # The configuration of the orchestration cluster (Zeebe). Blueberry reads it in /actuator/env of Zeebe when it can
  # (CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_*). These values are used when the actuator can't be reached, or does not give the variable.
  orchestrationConfig:
    # Secondary storage of the cluster: elasticsearch, postgres or sqlserver (CAMUNDA_DATA_SECONDARYSTORAGE_TYPE,
    # camunda.data.secondary-storage.type). For postgres: blueberry.postgres.host, port, database, username, password,
    # backupDirectory (pg_dump and pg_restore must be installed). For sqlserver, see the blueberry.sqlserver section of the
    # documentation (url, username, password, database, backupPath). With "rdbms" in the cluster, this value gives the vendor.
    secondaryStorage: elasticsearch
    # CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_BACKUP_REPOSITORYNAME: the Elasticsearch snapshot repository of the history backup (the same name as the cluster)
    backupRepositoryName: camunda_zeebe_records_backup

    # The container used by Zeebe and by Elasticsearch (CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_STORE and the variables of its type)
    container:
      # gcs, s3, azure or filesystem
      containerType: gcs
    azure:
      # CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_AZURE_CONTAINERNAME
      containerName: "YourAzureContainerName"
    s3:
      # CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_S3_BUCKETNAME, _S3_REGION
      bucketName: "YourS3Bucket"
      region: "us-east-2"
    gcs:
      # CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_GCS_BUCKETNAME, _GCS_BASEPATH
      bucketName: "pym-pc8backup-20250411"
      basePath: "zeebecontainer"
    filesystem:
      # CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_FILESYSTEM_BASEPATH: the directory of Zeebe
      basePath: /usr/local/camunda/backups/zeebe
      # The directory of the Elasticsearch repository, as Elasticsearch sees it (path.repo must contain it). Only for filesystem
      # path: /usr/share/elasticsearch/backups/elasticsearch
    # CAMUNDA_DATA_PRIMARYSTORAGE_BACKUP_CONTINUOUS, _SCHEDULE, _CHECKPOINTINTERVAL, _RETENTION_WINDOW
    backupContinuous: true
    backupSchedule: PT10M
    backupCheckpointInterval: PT1M
    backupRetentionWindow: P7D

  # When repository need to be created, then a base path is used. All based path used
  elasticsearch:
    enabled: true
    optimizeContainerBasePath: /optimize
    zeebeRecordContainerBasePath: /zeeberecord
    # ZeebeRecord need a backup. Here is the name of the backup to be created
    zeebeRecordRepository: camunda_zeebe_records_backup
    zeebeRecordBasePath: zeeberecordbackup

    # The container used by Zeebe and by Elasticsearch is in blueberry.orchestrationConfig


server:
  port: 9082

# -------------------- Self Manage
camunda:
  client:
    mode: self-managed
    auth:
      method: basic
      username: "demo"
      password: "demo"


logging.level.root: INFO




# Spring Boot Configuration
spring.application.name: Blueberry

spring:
  # Default database: H2 file based, in ./data (no external database needed). Override with SPRING_DATASOURCE_URL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/blueberry;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
